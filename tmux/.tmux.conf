# ~/.tmux.conf

# -----------------------------------------------------------------------------
# 🛠️ CORE CONFIG
# -----------------------------------------------------------------------------

# Rebind prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind -N "Send prefix (Ctrl-a)" C-a send-prefix

# Reload config
bind -N "Reload ~/.tmux.conf" r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Base index for windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window merging/unmerging
unbind m
bind -N "Merge another window into current window as split pane" m {
  if-shell -F "#{==:#{window_panes},1}" {
    set -p -F @pane_name "#{window_name}"
  }
  choose-tree -w {
    run-shell '
      H="#"
      target="%%"
      win_id=$(tmux display -p "$H{window_id}")
      src_win=$(tmux display -p -t "$target" "$H{window_id}")
      if [ "$src_win" = "$win_id" ]; then
        exit 0
      fi
      src_name=$(tmux display -p -t "$target" "$H{?@pane_name,$H{@pane_name},$H{window_name}}")
      tmux set -p -t "$target" @pane_name "$src_name"
      tmux join-pane -h -s "$target"
      tmux select-layout -t "$win_id" even-horizontal
      merged=$(tmux list-panes -t "$win_id" -F "$H{?@pane_name,$H{@pane_name},$H{window_name}}" | awk "NR>1{printf \" + \"}{printf \"%s\",\$0}")
      if [ -n "$merged" ]; then
        tmux rename-window -t "$win_id" "$merged"
      fi
    '
  }
}
# Unmerge the focused pane using prefix + ! (or prefix + u)
unbind u
unbind !
bind -N "Unmerge focused pane into its own window" ! run-shell '
  H="#"
  if [ "$(tmux display -p "$H{window_panes}")" -le 1 ]; then
    exit 0
  fi
  src_win=$(tmux display -p "$H{window_id}")
  pane_name=$(tmux display -p "$H{@pane_name}")
  if [ -n "$pane_name" ]; then
    tmux break-pane -n "$pane_name"
  else
    tmux break-pane
  fi
  rem_name=$(tmux list-panes -t "$src_win" -F "$H{?@pane_name,$H{@pane_name},}" | awk "NF{if(n++)printf \" + \"; printf \"%s\",\$0}")
  if [ -n "$rem_name" ]; then
    tmux rename-window -t "$src_win" "$rem_name"
  fi
'
bind -N "Unmerge focused pane into its own window" u run-shell '
  H="#"
  if [ "$(tmux display -p "$H{window_panes}")" -le 1 ]; then
    exit 0
  fi
  src_win=$(tmux display -p "$H{window_id}")
  pane_name=$(tmux display -p "$H{@pane_name}")
  if [ -n "$pane_name" ]; then
    tmux break-pane -n "$pane_name"
  else
    tmux break-pane
  fi
  rem_name=$(tmux list-panes -t "$src_win" -F "$H{?@pane_name,$H{@pane_name},}" | awk "NF{if(n++)printf \" + \"; printf \"%s\",\$0}")
  if [ -n "$rem_name" ]; then
    tmux rename-window -t "$src_win" "$rem_name"
  fi
'

# Keep @pane_name in sync when renaming with prefix + ,
bind -N "Rename current window / merged pane" , command-prompt -I "#{?#{>:#{window_panes},1},#{?@pane_name,#{@pane_name},#W},#W}" {
  set -p @pane_name "%%"
  run-shell '
    H="#"
    win_id=$(tmux display -p "$H{window_id}")
    merged=$(tmux list-panes -t "$win_id" -F "$H{?@pane_name,$H{@pane_name},$H{window_name}}" | awk "NR>1{printf \" + \"}{printf \"%s\",\$0}")
    if [ -n "$merged" ]; then
      tmux rename-window -t "$win_id" "$merged"
    fi
  '
}

# Window reordering
# Move the current window to an index, swapping with whatever is already there
# (plain move-window refuses an occupied index). Focus follows the moved window.
bind -N "Move/swap current window to target index" . command-prompt -p "move window to:" {
  if-shell -F "#{W:#{?#{==:#{window_index},%%},1,}}" "swap-window -d -t ':%%'" "move-window -t ':%%'"
}
# Nudge the current window left/right; repeatable without re-pressing the prefix.
bind -N "Swap current window left" -r "<" swap-window -d -t :-1
bind -N "Swap current window right" -r ">" swap-window -d -t :+1

# Mouse support
set -g mouse on

# Vim-like navigation
# h/l to switch windows (tabs)
bind -N "Previous window" h previous-window
bind -N "Next window" l next-window

# Split panes using | and -
bind -N "Split pane horizontally (side by side)" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically (top/bottom)" - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in the current path
bind -N "New window in current path" c new-window -c "#{pane_current_path}"

# Open btop in a floating popup overlay (prefix + b)
bind -N "Open btop system monitor overlay" b display-popup -E -b rounded -w 90% -h 90% "btop"

# Open lazygit in a floating popup overlay (prefix + g)
bind -N "Open LazyGit overlay" g display-popup -E -b rounded -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Project / session switcher powered by zoxide + fzf (prefix + f)
bind -N "Switch session / project via zoxide + fzf" f display-popup -E -b rounded -w 80% -h 80% "~/.tmux_scripts/sessionizer.sh"

# Toggle persistent floating scratchpad terminal (prefix + t)
bind -N "Toggle floating scratchpad terminal" t if-shell -F '#{==:#{session_name},scratch}' \
  'detach-client' \
  'display-popup -E -b rounded -w 85% -h 85% -d "#{pane_current_path}" "tmux new-session -A -s scratch \; set -t scratch status off"'

# Fuzzy-searchable keybindings viewer (prefix + ?)
bind -N "Search keybindings with fzf" ? display-popup -E -b rounded -w 80% -h 80% "~/.tmux_scripts/keybindings.py"

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB:Ss=\\E[%p1%d q:Se=\\E[2 q"

# Reduce escape time for Neovim
set -sg escape-time 10

# Image passthrough for image.nvim
# Let Neovim send Kitty graphics protocol escape sequences straight through
# tmux to Ghostty. visual-activity off keeps tmux from flashing a bell message
# when an image lands in a pane that isn't the active one.
set -gq allow-passthrough on
set -g visual-activity off

# -----------------------------------------------------------------------------
# 🎨 LOOK & FEEL (Hyper-Modern)
# -----------------------------------------------------------------------------

# 1. Static Pane Config
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format ""

# 2. Status Bar Design
set -g status-position top
set -g status-justify left
set -g status-style bg=default,fg=white
set -g status-interval 2
set -g status-left-length 100
set -g status-right-length 220

# 3. Leader Key Indicator (Prefix) & Status Right
# "Pill" design: turns RED when prefix is active, uses theme accent otherwise.
# This blue fallback is only visible until the shades daemon applies the real theme.
set -g status-left "#{?client_prefix,#[fg=red]#[bg=red]#[fg=black]󰠠 #S#[bg=default]#[fg=red] ,#[fg=blue]#[bg=blue]#[fg=black]#[bold]󰇄 #S#[bg=default]#[nobold]#[fg=blue] } "
set -g status-right "#{?#($HOME/.tmux_scripts/tmux-spotify-info),#[fg=green]#[bg=green]#[fg=black]#($HOME/.tmux_scripts/tmux-spotify-info)#[bg=default]#[fg=green] ,}#{?#($HOME/.tmux_scripts/git-status.sh #{pane_current_path}),#[fg=cyan]#[bg=cyan]#[fg=black]#($HOME/.tmux_scripts/git-status.sh #{pane_current_path})#[bg=default]#[fg=cyan] ,}#[fg=yellow]#[bg=yellow]#[fg=black]#($HOME/.tmux_scripts/sysstat.py)#[bg=default]#[fg=yellow] #[fg=blue]#[bg=blue]#[fg=black]󰥔 %H:%M#[bg=default]#[fg=blue] #[fg=magenta]#[bg=magenta]#[fg=black]󰃭 %Y-%m-%d#[bg=default]#[fg=magenta]"

# 4. Window Status (The "Animatic" feel)
set -g window-status-format "#[fg=brightblack] #I:#W "
# Blue pill fallback, same reasoning as status-left above.
set -g window-status-current-format "#[fg=blue]#[fg=black,bg=blue,bold]#I:#W#[bg=default,fg=blue,nobold]"

# Message styling
set -g message-style bg=magenta,fg=black,bold

# 5. Theme Sourcing
# Dynamic status bar styling is normally pushed live by the shades daemon client,
# but it only reacts to theme-change events, not new tmux servers. Pull the
# currently-active theme immediately so a fresh server doesn't sit on the fallback
# pills above until the next `shades set`.
run-shell -b "~/.tmux_scripts/apply-theme.py"
set-hook -g session-created "run-shell -b '~/.tmux_scripts/apply-theme.py'"

# -----------------------------------------------------------------------------
# 🔌 PLUGINS
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
