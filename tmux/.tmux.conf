# ~/.tmux.conf

# -----------------------------------------------------------------------------
# 🛠️ CORE CONFIG
# -----------------------------------------------------------------------------

# Rebind prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Base index for windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window merging/unmerging
unbind m
bind m {
  if-shell -F "#{==:#{window_panes},1}" {
    set -p -F @pane_name "#{window_name}"
  }
  choose-tree -w {
    run-shell '
      H="#"
      target="%%"
      win_id=$(tmux display -p "$H{window_id}")
      src_win=$(tmux display -p -t "$target" "$H{window_id}")
      if [ "$src_win" = "$win_id" ]; then
        exit 0
      fi
      src_name=$(tmux display -p -t "$target" "$H{?@pane_name,$H{@pane_name},$H{window_name}}")
      tmux set -p -t "$target" @pane_name "$src_name"
      tmux join-pane -h -s "$target"
      tmux select-layout -t "$win_id" even-horizontal
      merged=$(tmux list-panes -t "$win_id" -F "$H{?@pane_name,$H{@pane_name},$H{window_name}}" | awk "NR>1{printf \" + \"}{printf \"%s\",\$0}")
      if [ -n "$merged" ]; then
        tmux rename-window -t "$win_id" "$merged"
      fi
    '
  }
}
# Unmerge the focused pane using prefix + ! (or prefix + u)
unbind u
unbind !
bind ! run-shell '
  H="#"
  if [ "$(tmux display -p "$H{window_panes}")" -le 1 ]; then
    exit 0
  fi
  src_win=$(tmux display -p "$H{window_id}")
  pane_name=$(tmux display -p "$H{@pane_name}")
  if [ -n "$pane_name" ]; then
    tmux break-pane -n "$pane_name"
  else
    tmux break-pane
  fi
  rem_name=$(tmux list-panes -t "$src_win" -F "$H{?@pane_name,$H{@pane_name},}" | awk "NF{if(n++)printf \" + \"; printf \"%s\",\$0}")
  if [ -n "$rem_name" ]; then
    tmux rename-window -t "$src_win" "$rem_name"
  fi
'
bind u run-shell '
  H="#"
  if [ "$(tmux display -p "$H{window_panes}")" -le 1 ]; then
    exit 0
  fi
  src_win=$(tmux display -p "$H{window_id}")
  pane_name=$(tmux display -p "$H{@pane_name}")
  if [ -n "$pane_name" ]; then
    tmux break-pane -n "$pane_name"
  else
    tmux break-pane
  fi
  rem_name=$(tmux list-panes -t "$src_win" -F "$H{?@pane_name,$H{@pane_name},}" | awk "NF{if(n++)printf \" + \"; printf \"%s\",\$0}")
  if [ -n "$rem_name" ]; then
    tmux rename-window -t "$src_win" "$rem_name"
  fi
'

# Keep @pane_name in sync when renaming with prefix + ,
bind , command-prompt -I "#{?#{>:#{window_panes},1},#{?@pane_name,#{@pane_name},#W},#W}" {
  set -p @pane_name "%%"
  run-shell '
    H="#"
    win_id=$(tmux display -p "$H{window_id}")
    merged=$(tmux list-panes -t "$win_id" -F "$H{?@pane_name,$H{@pane_name},$H{window_name}}" | awk "NR>1{printf \" + \"}{printf \"%s\",\$0}")
    if [ -n "$merged" ]; then
      tmux rename-window -t "$win_id" "$merged"
    fi
  '
}

# Window reordering
# Move the current window to an index, swapping with whatever is already there
# (plain move-window refuses an occupied index). Focus follows the moved window.
bind . command-prompt -p "move window to:" {
  if-shell -F "#{W:#{?#{==:#{window_index},%%},1,}}" "swap-window -d -t ':%%'" "move-window -t ':%%'"
}
# Nudge the current window left/right; repeatable without re-pressing the prefix.
bind -r "<" swap-window -d -t :-1
bind -r ">" swap-window -d -t :+1

# Mouse support
set -g mouse on

# Vim-like navigation
# h/l to switch windows (tabs)
bind h previous-window
bind l next-window

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB:Ss=\\E[%p1%d q:Se=\\E[2 q"

# Reduce escape time for Neovim
set -sg escape-time 10

# Image passthrough for image.nvim
# Let Neovim send Kitty graphics protocol escape sequences straight through
# tmux to Ghostty. visual-activity off keeps tmux from flashing a bell message
# when an image lands in a pane that isn't the active one.
set -gq allow-passthrough on
set -g visual-activity off

# -----------------------------------------------------------------------------
# 🎨 LOOK & FEEL (Hyper-Modern)
# -----------------------------------------------------------------------------

# 1. Static Pane Config
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format ""

# 2. Status Bar Design
set -g status-position top
set -g status-justify left
set -g status-style bg=default,fg=white
set -g status-left-length 100
set -g status-right-length 100

# 3. Leader Key Indicator (Prefix)
# "Pill" design: turns RED when prefix is active, uses theme accent otherwise.
# This blue fallback is only visible until the shades daemon applies the real theme.
set -g status-left "#{?client_prefix,#[fg=red]#[bg=red]#[fg=black]󰠠 #S#[bg=default]#[fg=red] ,#[fg=blue]#[bg=blue]#[fg=black]#[bold]󰇄 #S#[bg=default]#[nobold]#[fg=blue] } "

# 4. Window Status (The "Animatic" feel)
set -g window-status-format "#[fg=brightblack] #I:#W "
# Blue pill fallback, same reasoning as status-left above.
set -g window-status-current-format "#[fg=blue]#[fg=black,bg=blue,bold]#I:#W#[bg=default,fg=blue,nobold]"

# Message styling
set -g message-style bg=magenta,fg=black,bold

# 5. Theme Sourcing
# Dynamic status bar styling is normally pushed live by the shades daemon client,
# but it only reacts to theme-change events, not new tmux servers. Pull the
# currently-active theme immediately so a fresh server doesn't sit on the fallback
# pills above until the next `shades set`.
run-shell -b "~/.tmux_scripts/apply-theme.py"
set-hook -g session-created "run-shell -b '~/.tmux_scripts/apply-theme.py'"

# -----------------------------------------------------------------------------
# 🔌 PLUGINS
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
